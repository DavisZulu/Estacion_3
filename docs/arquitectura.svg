<text x="460.0" y="215" font-size="14" font-weight="bold" fill="#15304A" text-anchor="middle">HTTP + JSON</text>
<text x="460.0" y="289" font-size="13" fill="#5B6B7A" text-anchor="middle">respuesta JSON</text>
<line x1="924" y1="225" x2="1036" y2="225" stroke="#2E6C99" stroke-width="2.4" marker-end="url(#a)"/>
<line x1="1036" y1="265" x2="924" y2="265" stroke="#2E6C99" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="980.0" y="215" font-size="14" font-weight="bold" fill="#15304A" text-anchor="middle">Prisma</text>
<text x="980.0" y="289" font-size="13" fill="#5B6B7A" text-anchor="middle">filas → objetos</text>
<text x="700.0" y="34" font-size="15" fill="#5B6B7A" text-anchor="middle">Tres procesos independientes, cada uno en su propia terminal. El navegador nunca habla con la base de datos: solo con la API.</text>
<text x="700.0" y="485" font-size="13" fill="#9AA6B0" text-anchor="middle">Flecha continua: petición · Flecha punteada: respuesta</text>
</svg>