<text x="1062" y="238" font-size="15" font-weight="bold" fill="#1F2D3D" font-family="Liberation Mono, monospace">empresa_db</text>
<text x="1062" y="257" font-size="13" fill="#5B6B7A">Tabla Transaccion</text>
<text x="1062" y="286" font-size="13" fill="#9AA6B0" letter-spacing="1.5">PERSISTENCIA</text>
<text x="1062" y="310" font-size="15" font-weight="bold" fill="#1F2D3D" font-family="Liberation Mono, monospace">mysql_datos</text>
