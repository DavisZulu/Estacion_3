<text x="542" y="190" font-size="15" font-weight="bold" fill="#1F2D3D" font-family="Liberation Mono, monospace">routes/</text>
<text x="542" y="209" font-size="13" fill="#5B6B7A">Recibe la petición HTTP y la dirige</text>
<text x="542" y="238" font-size="15" font-weight="bold" fill="#1F2D3D" font-family="Liberation Mono, monospace">controllers/</text>
<text x="542" y="257" font-size="13" fill="#5B6B7A">Valida, aplica las reglas y calcula el saldo</text>
<text x="542" y="286" font-size="15" font-weight="bold" fill="#1F2D3D" font-family="Liberation Mono, monospace">models/</text>
<text x="542" y="305" font-size="13" fill="#5B6B7A">Única capa que consulta la base de datos</text>
